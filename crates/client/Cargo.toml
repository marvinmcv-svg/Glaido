[package]
name = "vocalis-client"
description = "Vocalis gateway client: the WebSocket dictation session used by the desktop app and the latency harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
vocalis-session = { path = "../session" }
