[workspace]
resolver = "2"
members = ["crates/core", "apps/gateway"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
vocalis-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
