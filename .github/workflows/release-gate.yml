name: Release gate

# Master prompt §8: dependency inventory and audits on every release candidate.
# Binary hardening and REA exposure audits are added once signed builds exist (PLAN O3).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm check:clean-room
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: pnpm audit (production dependencies)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
