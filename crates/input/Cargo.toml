[package]
name = "vocalis-input"
description = "Vocalis hotkeys: chord matching for the gesture recognizer, OS key listeners"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Global key listening through rdev (CGEventTap on macOS, LL hooks on Windows, X11 on Linux).
listen = ["dep:rdev"]

[dependencies]
rdev = { version = "0.5", optional = true }
serde.workspace = true
thiserror.workspace = true
vocalis-core.workspace = true

[dev-dependencies]
proptest = "1"
